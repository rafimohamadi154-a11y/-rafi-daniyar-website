<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rafi Daniyar - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .header {
      background: #ffffff;
      padding: 25px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
      color: #777;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-top: 0;
    }

    .button {
      display: inline-block;
      padding: 12px 20px;
      background: #0071e3;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    .button:hover {
      background: #005bb5;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Rafi Daniyar</h1>
    <p>پنل مدیریت سایت</p>
  </div>

  <div class="container">

    <div class="card">
      <h2>داشبورد</h2>
      <p>به پنل مدیریت سایت خوش آمدید.</p>
    </div>

    <div class="card">
      <h2>مدیریت محتوا</h2>
      <p>از این بخش می‌توانیم محتوای سایت را مدیریت کنیم.</p>

      <button class="button" onclick="alert('بخش مدیریت محتوا در حال ساخت است')">
        مدیریت محتوا
      </button>
    </div>

    <div class="card">
      <h2>تنظیمات</h2>
      <p>این بخش در مرحله بعد تکمیل می‌شود.</p>
    </div>

  </div>

</body>
</html>
