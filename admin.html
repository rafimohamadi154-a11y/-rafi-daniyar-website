<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rafi Daniyar - Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .box {
      max-width: 500px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 16px;
    }

    input {
      border: 1px solid #ddd;
    }

    button {
      border: none;
      background: #0071e3;
      color: white;
      cursor: pointer;
    }

    #panel {
      display: none;
    }

    #error {
      color: red;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="box" id="login">
    <h1>ورود مدیر</h1>

    <input id="email" type="email" placeholder="ایمیل مدیر">
    <input id="password" type="password" placeholder="رمز عبور">

    <button onclick="login()">ورود به پنل</button>

    <div id="error"></div>
  </div>

  <div class="box" id="panel">
    <h1>پنل مدیریت Rafi Daniyar</h1>
    <p>با موفقیت وارد شدید.</p>

    <button onclick="logout()">خروج</button>
  </div>

<script>
const SUPABASE_URL = "https://wyiyxlsoiontiodvkrer.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_hXfkZZi12uGcKclV8jo2fw_dDZ3WA81";
  

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  async function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      document.getElementById("error").innerText = error.message;
      return;
    }

    showPanel();
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    document.getElementById("panel").style.display = "none";
    document.getElementById("login").style.display = "block";
  }

  function showPanel() {
    document.getElementById("login").style.display = "none";
    document.getElementById("panel").style.display = "block";
  }

  async function checkUser() {
    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {
      showPanel();
    }
  }

  checkUser();
</script>

</body>
</html>
